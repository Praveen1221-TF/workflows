name: nodejs-feature-pipeline
on: 
  workflow_call: 
    inputs:
      project:
        required: true
        type: string
      component:
        required: true
        type: string
      environment:
        required: true
        type: string
env:
  ACC_ID: "008616580268"

jobs:
  feature-nodejs-pipeline:
    runs-on: self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: list files
        run: ls -l

      - name: get the version
        run: |
          # if you store it in the GITHUB_ENV, you can use it in other steps in the same job
          echo "APP_VERSION=${GITHUB_SHA::9}" >> "$GITHUB_ENV" 
      
      - name: print inputs
        run: |
          echo ${{ inputs.project }}
          echo "version: ${APP_VERSION}"

      - name: install dependencies
        run: npm install

      - name: run unit tests
        run: echo "run unti tests"
      
      - name: docker build
        run: |
          docker build -t ${ACC_ID}.dkr.ecr.us-east-1.amazonaws.com/${{ inputs.project }}/${{ inputs.component }}:${APP_VERSION} .
          docker images   

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: push image
        run: |

          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${ACC_ID}.dkr.ecr.us-east-1.amazonaws.com

          docker push  ${ACC_ID}.dkr.ecr.us-east-1.amazonaws.com/${{ inputs.project }}/${{ inputs.component }}:${APP_VERSION} 
          



